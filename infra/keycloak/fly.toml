# Fly.io app for Keycloak. Deploy from the repository root:
#   fly deploy --config infra/keycloak/fly.toml infra/keycloak
# Secrets: KC_DB_URL (jdbc:postgresql://<neon-direct-host>/keycloak?sslmode=require),
# KC_DB_USERNAME, KC_DB_PASSWORD, and for a fresh database KC_BOOTSTRAP_ADMIN_USERNAME and
# KC_BOOTSTRAP_ADMIN_PASSWORD (a temporary admin; replace it, then unset both secrets).
#
# The public hostname is part of every token's issuer. Keep it on a domain you control
# (pathway-auth.orangecastle.net) so future hosting moves do not invalidate the issuer again.
app = "pathway-auth"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  KC_DB = "postgres"
  KC_HOSTNAME = "https://pathway-auth.orangecastle.net"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/realms/master"
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
