# Fly.io app for the public Pathway API. Deploy from the repository root:
#   fly deploy --config backend/fly.toml backend
# Secrets (never put them here): DATABASE_URL, EVALUATOR_SHARED_SECRET, ANALYTICS_ADMIN_KEY.
app = "pathway-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.vercel"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  CORS_ORIGINS = "https://pathway.orangecastle.net"
  AUTH_AUTHORITY = "https://<auth0-tenant-domain>/"
  AUTH_AUDIENCE = "https://api.pathway.orangecastle.net"
  TRUST_PROXY_HEADERS = "true"
  # Private Fly network address of the evaluator broker (no public route exists).
  EVALUATOR_URL = "http://pathway-broker.internal:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    # Neon can take a few seconds to resume a suspended compute.
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
