name: Inspect @vercel/sandbox API (temporary)

# One-off: type-checks the broker's exact @vercel/sandbox calls against the installed SDK and
# reports each compiler error as an annotation. Delete after use.
on:
  push:
    branches: [infra/vercel-auth0]
    paths: [.github/workflows/refresh-broker-lockfile.yml]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: sandbox-broker
        run: npm ci --ignore-scripts --no-audit --no-fund && npm install --no-save typescript@5.9.3 @types/node@22
      - name: Type-check the broker's SDK usage
        working-directory: sandbox-broker
        run: |
          cat > sdk-check.ts <<'TS'
          import { Readable } from 'node:stream'
          import { Sandbox } from '@vercel/sandbox'
          async function check(token: string) {
            const sandbox = await Sandbox.create({
              teamId: 'team_x', projectId: 'prj_x', token,
              image: 'dotnet:latest', networkPolicy: 'deny-all', resources: { vcpus: 1 }, timeout: 60_000,
            })
            await sandbox.writeFiles([{ path: '/workspace/a.txt', content: Buffer.from('x', 'utf8') }])
            const signal = AbortSignal.timeout(12_000)
            const result = await sandbox.runCommand({ cmd: 'bash', args: ['x'], cwd: '/workspace', signal, stdin: Readable.from(['{}']) })
            const code: number | null = result.exitCode
            const out: string = await result.stdout()
            const err: string = await result.stderr()
            await sandbox.stop()
            return [code, out, err]
          }
          void check
          TS
          set +e
          npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --skipLibCheck sdk-check.ts > tsc.out 2>&1
          status=$?
          while IFS= read -r line; do echo "::error::$line"; done < tsc.out
          [ "$status" = 0 ] && echo "::notice::@vercel/sandbox $(node -p "require('@vercel/sandbox/package.json').version") accepts every call the broker makes."
          exit $status
