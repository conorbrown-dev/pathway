name: Inspect @vercel/sandbox API (temporary)

# One-off: prints the installed SDK's type declarations for the options the broker uses, so the
# broker code can be checked against the real API. Delete after use.
on:
  push:
    branches: [infra/vercel-auth0]
    paths: [.github/workflows/refresh-broker-lockfile.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: sandbox-broker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Declarations
        working-directory: sandbox-broker/node_modules/@vercel/sandbox
        run: |
          echo "== files"; ls dist | head -50
          for pattern in 'teamId' 'projectId' 'token' 'networkPolicy' 'NetworkPolicy =' 'resources' 'vcpus' 'timeout' 'image' 'writeFiles' 'runCommand' 'stdin' 'signal' 'exitCode' 'stdout(' 'stop('; do
            echo "== $pattern"; grep -rhn --include='*.d.ts' -F "$pattern" dist | head -8
          done
