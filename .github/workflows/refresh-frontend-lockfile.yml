name: Refresh frontend lockfile (temporary)

# One-off: the authoring sandbox cannot reach the npm registry, so this regenerates
# frontend/package-lock.json from package.json on GitHub and commits it back to this branch.
# Delete this workflow once the lockfile commit lands.
on:
  push:
    branches: [infra/vercel-auth0]
    paths: [frontend/package.json]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify a clean install works from the new lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npm ls @auth0/auth0-spa-js
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo "Lockfile already up to date."; exit 0; }
          git commit -m "Regenerate frontend lockfile for @auth0/auth0-spa-js"
          git push
