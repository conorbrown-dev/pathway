name: Verify Pathway

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/Pathway.Api/**'
      - 'backend/Pathway.Api.Tests/**'
      - 'evaluator/Pathway.Evaluator/**'
      - 'sandbox-broker/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Pathway.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Curriculum invariant tests
        run: dotnet test ../Pathway.Api.Tests --configuration Release --logger "console;verbosity=normal"

  evaluator:
    name: Evaluator build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluator/Pathway.Evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  sandbox-broker:
    name: Sandbox broker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox-broker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml==6.0.3
      # Same toolchain as sandbox-broker/images/rust, so fixture tests compile like the sandbox does.
      - run: rustup toolchain install 1.97.0 --profile minimal && rustup default 1.97.0 && rustc --version
      - run: npm ci
      - run: npm test
        env:
          PATHWAY_REQUIRE_PYYAML: '1'
          PATHWAY_REQUIRE_RUSTC: '1'

  browser-e2e:
    name: Complete local browser E2E suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: dotnet build --configuration Release
        working-directory: backend/Pathway.Api
      - run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5100 dotnet run --configuration Release --no-build --no-launch-profile > /tmp/pathway-api.log 2>&1 &
          echo $! > /tmp/pathway-api.pid
        working-directory: backend/Pathway.Api
      - run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5100/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pathway-api.log || true
          exit 1
      - run: PLAYWRIGHT_VITE_API_BASE_URL=http://127.0.0.1:5100 npm run test:e2e
        working-directory: frontend

  container-images:
    name: Container images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend/Pathway.Api
          - name: broker
            context: sandbox-broker
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image (no push)
        run: docker build --file ${{ matrix.context }}/Dockerfile.vercel --tag pathway-${{ matrix.name }}:ci ${{ matrix.context }}
