name: Verify Pathway

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/Pathway.Api/**'
      - 'backend/Pathway.Api.Tests/**'
      - 'evaluator/Pathway.Evaluator/**'
      - 'infra/keycloak/**'
      - 'modal-broker/**'
      - 'docker-compose.keycloak.yml'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Pathway.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Curriculum invariant tests
        run: dotnet test ../Pathway.Api.Tests --configuration Release --logger "console;verbosity=normal"

  evaluator:
    name: Evaluator build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluator/Pathway.Evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  modal-broker:
    name: Modal broker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modal-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modal-broker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml==6.0.3
      - run: npm ci
      - run: npm test
        env:
          PATHWAY_REQUIRE_PYYAML: '1'

  browser-e2e:
    name: Complete local browser E2E suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: dotnet build --configuration Release
        working-directory: backend/Pathway.Api
      - run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5100 dotnet run --configuration Release --no-build --no-launch-profile > /tmp/pathway-api.log 2>&1 &
          echo $! > /tmp/pathway-api.pid
        working-directory: backend/Pathway.Api
      - run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5100/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pathway-api.log || true
          exit 1
      - run: PLAYWRIGHT_VITE_API_BASE_URL=http://127.0.0.1:5100 npm run test:e2e
        working-directory: frontend

  keycloak-config:
    name: Keycloak configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool infra/keycloak/realm-import/pathway-realm.json > /dev/null
      - run: docker compose --env-file .env.keycloak.example -f docker-compose.keycloak.yml config > /dev/null
      # With a fresh database this file is the whole identity configuration, so import it into
      # the pinned Keycloak version and check the settings production relies on.
      - name: Import realm into Keycloak 26.1 and verify settings
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=ci-admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-throwaway \
            -v "$PWD/infra/keycloak/realm-import:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.1.0 start-dev --import-realm
          for attempt in $(seq 1 90); do
            curl -fsS http://localhost:8080/realms/pathway/.well-known/openid-configuration > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8080/realms/pathway/.well-known/openid-configuration > /dev/null || { docker logs kc | tail -50; exit 1; }
          token=$(curl -fsS -d grant_type=password -d client_id=admin-cli -d username=ci-admin -d password=ci-only-throwaway \
            http://localhost:8080/realms/master/protocol/openid-connect/token | jq -r .access_token)
          realm=$(curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/admin/realms/pathway)
          client=$(curl -fsS -H "Authorization: Bearer $token" "http://localhost:8080/admin/realms/pathway/clients?clientId=pathway-web" | jq '.[0]')
          check() { if [ "$(jq -r "$2" <<<"$1")" = "$3" ]; then echo "ok   $2 = $3"; else echo "FAIL $2 = $(jq -r "$2" <<<"$1") (expected $3)"; failed=1; fi; }
          failed=0
          check "$realm"  '.registrationAllowed' true
          check "$realm"  '.bruteForceProtected' true
          check "$realm"  '.passwordPolicy' 'length(12) and notUsername and notEmail'
          check "$realm"  '.sslRequired' external
          check "$client" '.publicClient' true
          check "$client" '.directAccessGrantsEnabled' false
          check "$client" '.attributes["pkce.code.challenge.method"]' S256
          check "$client" '.attributes["post.logout.redirect.uris"]' '+'
          check "$client" '.redirectUris | index("https://pathway.orangecastle.net/*") != null' true
          check "$client" '.webOrigins | index("https://pathway.orangecastle.net") != null' true
          check "$client" '[.protocolMappers[] | select(.protocolMapper == "oidc-audience-mapper") | .config["included.client.audience"]] | index("pathway-api") != null' true
          docker rm -f kc > /dev/null
          exit $failed

  container-images:
    name: Container images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend/Pathway.Api
          - name: broker
            context: modal-broker
          - name: keycloak
            context: infra/keycloak
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image (no push)
        run: docker build --tag pathway-${{ matrix.name }}:ci ${{ matrix.context }}
