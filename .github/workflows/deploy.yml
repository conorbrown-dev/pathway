name: Deploy to Fly.io

# Deploys only commits that passed "Verify Pathway" on a push to main, and deploys exactly the
# verified commit (workflow_run.head_sha), not whatever main points to by the time this runs.
# The frontend is deployed by Vercel's Git integration (root directory: frontend).
on:
  workflow_run:
    workflows: ["Verify Pathway"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      # Sequential: the broker and Keycloak come up before the API that depends on them.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - app: pathway-broker
            config: modal-broker/fly.toml
            context: modal-broker
          - app: pathway-auth
            config: infra/keycloak/fly.toml
            context: infra/keycloak
          - app: pathway-api
            config: backend/Pathway.Api/fly.toml
            context: backend/Pathway.Api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --config ${{ matrix.config }} ${{ matrix.context }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
